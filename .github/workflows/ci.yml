name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited covers a change of base branch.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  SPDX_HEADER: "// SPDX-License-Identifier: GPL-3.0-or-later"

jobs:
  build:
    name: Build and test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: minimum
            go-version-file: go.mod
          - go: stable
            go-version: stable
            lint: true
    steps:
      - name: Require pull requests to target main
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "::error::pull requests must target main, not $BASE_REF"
          exit 1

      # Depth 2 so that HEAD~1 exists: on a pull request's merge commit,
      # the main it was merged with; on main, the previous main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      - name: Install Gio system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev

      - name: Build
        run: go build ./...

      - name: Build everything except the host without cgo
        env:
          CGO_ENABLED: "0"
        run: go list -e ./... | grep -v '/cmd/tessera$' | xargs go build

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: matrix.lint
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Staticcheck
        if: matrix.lint
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Lint protocol
        if: matrix.lint
        working-directory: proto
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.74.0 lint
          go run github.com/bufbuild/buf/cmd/buf@v1.74.0 format -d --exit-code

      # The rules are pinned here rather than read from proto/buf.yaml,
      # so editing that file cannot weaken them. The pinned config
      # replaces buf.yaml, so it must repeat any deps or excludes added
      # there. HEAD~1 is the previous main because main takes only squash
      # and merge commits (rebase merging is off).
      - name: Check protocol for breaking changes
        if: matrix.lint
        working-directory: proto
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.74.0 breaking \
            --config '{"version":"v2","breaking":{"use":["FILE"]}}' \
            --against "../.git#ref=HEAD~1,subdir=proto"

      - name: Check generated code is up to date
        if: matrix.lint
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Check SPDX headers
        if: matrix.lint
        run: |
          missing=0
          for f in $(git ls-files '*.go' '*.proto'); do
            if [ "$(head -n 1 "$f")" != "$SPDX_HEADER" ]; then
              echo "::error file=$f,line=1::missing SPDX header"; missing=1
            fi
          done
          exit $missing
