name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION $version is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host:
    name: Host (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Gio system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev

      - name: Build
        run: |
          mkdir -p stage dist
          go build -trimpath -ldflags "-s -w" -o stage/tessera ./cmd/tessera
          cp LICENSE stage/

      - name: Smoke test
        run: test "$(stage/tessera --version)" = "tessera $VERSION"

      - name: Package
        run: tar -C stage -czf "dist/tessera_${VERSION}_${GOOS}_${GOARCH}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  plugins:
    name: First-party plugins
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build and package for every Linux target
        run: |
          mkdir -p dist
          listed=$(GOOS=linux go list -f '{{if eq .Name "main"}}{{.Dir}}{{end}}' ./plugins/...)
          mapfile -t plugins < <(printf '%s\n' "$listed" | sed '/^$/d')
          if [ ${#plugins[@]} -eq 0 ]; then
            echo "No first-party plugins found." >&2
            exit 1
          fi
          for goarch in amd64 arm64; do
            stage=$(mktemp -d)
            for dir in "${plugins[@]}"; do
              GOOS=linux GOARCH=$goarch go build -trimpath -ldflags "-s -w" -o "$stage/$(basename "$dir")" "$dir"
            done
            cp LICENSE "$stage/"
            tar -C "$stage" -czf "dist/tessera-plugins_${VERSION}_linux_${goarch}.tar.gz" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, host, plugins]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "tessera ${{ needs.version.outputs.version }}"
